plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
}

version = project.version
group = project.group
base { archivesName = project.archives_base_name }

repositories {
	maven { name = 'Hypixel'; url = 'https://repo.hypixel.net/repository/Hypixel/' }
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

	// Compile against the Hypixel Mod API; it is NOT bundled. If the user has the
	// hypixel-mod-api mod installed we use its location event, otherwise we fall back
	// to scoreboard / tab list parsing.
	compileOnly "net.hypixel:mod-api:${project.hypixel_mod_api_version}"

	testImplementation 'org.junit.jupiter:junit-jupiter:5.11.4'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

test { useJUnitPlatform() }

processResources {
	def version = project.version
	inputs.property "version", version
	filesMatching("fabric.mod.json") { expand "version": version }
}

tasks.withType(JavaCompile).configureEach { it.options.release = 25 }

java {
	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

// In-game client tests (launch a real client). Opt-in so `./gradlew build` never starts the game:
//   ./gradlew runClientGameTest -PclientGameTest
if (project.hasProperty('clientGameTest')) {
	fabricApi {
		configureTests {
			createSourceSet = true
			modId = "chocotracker-gametest"
			enableGameTests = false
			enableClientGameTests = true
			eula = true
		}
	}
}
